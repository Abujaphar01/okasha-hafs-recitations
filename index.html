<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Okasha Kameny — Hafs 'An-Asim Recitations</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#03120d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okasha Hafs">
  <link rel="icon" type="image/jpeg" href="img/sheikh_okasha_thumb.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.min.css">

  <!-- Google Fonts for Arabic & English Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-emerald-950 text-slate-100 font-sans min-h-screen flex flex-col pb-44 selection:bg-gold-500 selection:text-emerald-950">

  <!-- Ambient Islamic Glow Background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/4 -right-40 w-[30rem] h-[30rem] bg-gold-500/10 rounded-full blur-3xl pulse-glow"></div>
    <div class="absolute bottom-32 left-1/4 w-96 h-96 bg-emerald-700/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-emerald-950/90 backdrop-blur-xl border-b border-emerald-800/40 px-4 py-3 sm:px-6">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="relative w-10 h-10 rounded-full overflow-hidden ring-2 ring-gold-500/50 shadow-md shrink-0 bg-emerald-900">
          <img src="img/sheikh_okasha_thumb.jpg" alt="Sheikh Okasha Kameny" class="w-full h-full object-cover">
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-base sm:text-lg text-white tracking-tight flex items-center gap-2 truncate">
            <span>Okasha Kameny</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gold-500/15 text-gold-400 border border-gold-500/30 shrink-0">
              حفص عن عاصم
            </span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <!-- PWA Install Button -->
        <button id="pwaInstallBtn" class="hidden flex items-center gap-1.5 text-xs bg-gold-500 hover:bg-gold-400 text-emerald-950 font-bold px-3 py-1.5 rounded-full shadow-md transition-all active:scale-95">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v7.586l2.293-2.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 10.586V3a1 1 0 011-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
          <span>Install App</span>
        </button>

        <span id="trackCountBadge" class="text-xs text-emerald-400/80 font-medium px-2 py-1 rounded-lg bg-emerald-900/40 border border-emerald-800/40">
          9 Recitations
        </span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 pt-5 flex-1 flex flex-col gap-5">

    <!-- Clean Reciter Profile Card -->
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-b from-emerald-900/50 to-emerald-950/80 border border-emerald-800/40 p-6 sm:p-7 flex flex-col items-center text-center shadow-lg">
      
      <!-- Sheikh Portrait (Clean Ring, No Badges) -->
      <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden ring-4 ring-gold-500/60 shadow-xl shadow-gold-500/10 bg-emerald-900 mb-3.5 shrink-0">
        <img src="img/sheikh_okasha.jpg" alt="Sheikh Okasha Kameny" class="w-full h-full object-cover">
      </div>

      <!-- Clean Typography -->
      <h2 class="font-['Amiri'] text-3xl sm:text-4xl font-bold text-white tracking-wide">
        الشيخ عكاشة حَسَن كَمِينِي
      </h2>
      <p class="text-sm sm:text-base font-semibold text-gold-300 mt-1">
        Sheikh Okasha Hassan Kameny
      </p>

      <!-- Simple Play & Shuffle Action Buttons -->
      <div class="flex items-center justify-center gap-3 mt-4">
        <button id="playAllBtn" class="flex items-center gap-2 bg-gradient-to-r from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-emerald-950 font-bold px-5 py-2.5 rounded-xl shadow-md transition-all active:scale-95 text-xs sm:text-sm">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Play All</span>
        </button>

        <button id="shuffleBtn" class="flex items-center gap-2 bg-emerald-900/50 hover:bg-emerald-800/60 border border-emerald-700/50 text-emerald-200 font-semibold px-4 py-2.5 rounded-xl transition-all active:scale-95 text-xs sm:text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4h4l8 16h4M4 20h4l3-6m5-10h4v4m-4-4l-3 6"/></svg>
          <span>Shuffle</span>
        </button>
      </div>

    </div>

    <!-- Search Bar -->
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-400/60">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Search Surah..."
        class="w-full pl-10 pr-10 py-3 rounded-2xl bg-emerald-900/30 border border-emerald-800/40 text-white placeholder-emerald-400/50 text-sm focus:outline-none focus:border-gold-500/60 focus:ring-1 focus:ring-gold-500/20 transition-all backdrop-blur-md"
      >
      <button id="clearSearchBtn" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-emerald-400/60 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Surah Playlist List -->
    <div class="flex flex-col gap-2.5" id="surahList">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- Floating Audio Player Bar (Deluxe Frosted Glass Dock) -->
  <div class="fixed bottom-0 inset-x-0 z-50 p-3 sm:p-4 pointer-events-none">
    <div class="max-w-4xl mx-auto rounded-3xl bg-emerald-950/90 backdrop-blur-2xl border border-emerald-700/50 shadow-2xl shadow-emerald-950 p-3 sm:p-4 pointer-events-auto flex flex-col gap-2.5">
      
      <!-- Top Row: Track Info + Scrubber -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
        
        <!-- Left: Track Thumbnail + Title -->
        <div class="flex items-center gap-3 min-w-0 w-full sm:w-auto">
          <div class="relative w-11 h-11 rounded-xl overflow-hidden ring-2 ring-gold-500/60 shadow-md shrink-0 bg-emerald-900">
            <img id="nowPlayingThumb" src="img/sheikh_okasha_thumb.jpg" alt="Now Playing" class="w-full h-full object-cover">
            <div id="playingBadge" class="hidden absolute inset-0 bg-emerald-950/40 flex items-center justify-center">
              <span class="w-2 h-2 rounded-full bg-gold-400 animate-ping"></span>
            </div>
          </div>

          <div class="truncate flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <h4 id="currentTrackTitle" class="font-bold text-white text-sm sm:text-base truncate">Surah Al-An'am</h4>
              <span id="currentSurahNum" class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-gold-500/20 text-gold-400 border border-gold-500/30">06</span>
            </div>
            <p id="currentTrackSub" class="text-xs text-emerald-300/80 truncate font-['Amiri'] font-bold">
              سورة الأنعام • Verses 29-59
            </p>
          </div>
        </div>

        <!-- Center / Scrubbing Slider (Mobile & Desktop) -->
        <div class="w-full sm:flex-1 sm:max-w-md flex items-center gap-2 px-1">
          <span id="currentTime" class="text-[11px] text-emerald-400/80 font-mono w-9 text-right shrink-0">0:00</span>
          <input id="seekBar" type="range" min="0" max="100" value="0" step="0.1" class="flex-1 h-1.5">
          <span id="durationTime" class="text-[11px] text-emerald-400/80 font-mono w-9 text-left shrink-0">12:52</span>
        </div>

      </div>

      <!-- Bottom Controls Row -->
      <div class="flex items-center justify-between pt-1 border-t border-emerald-800/30">
        
        <!-- Left: Secondary Tools (Skip 10s back, Info) -->
        <div class="flex items-center gap-1 sm:gap-2">
          <button id="skipBackBtn" class="p-2 text-emerald-300/80 hover:text-gold-400 transition-colors rounded-lg hover:bg-emerald-900/40" title="Rewind 10 Seconds">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
          </button>

          <!-- Speed Button -->
          <button id="speedBtn" class="text-xs font-bold text-emerald-300 hover:text-gold-400 px-2 py-1 rounded-lg hover:bg-emerald-900/50 transition-colors border border-emerald-700/40" title="Playback Speed">
            1.0x
          </button>
        </div>

        <!-- Center: Primary Playback Controls -->
        <div class="flex items-center gap-2 sm:gap-3">
          <button id="prevBtn" class="p-2 text-emerald-300 hover:text-white transition-all active:scale-90" title="Previous Recitation">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button id="playPauseBtn" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-emerald-950 flex items-center justify-center shadow-lg shadow-gold-500/30 transition-all active:scale-95" title="Play / Pause">
            <svg id="playIcon" class="w-6 h-6 fill-current translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button id="nextBtn" class="p-2 text-emerald-300 hover:text-white transition-all active:scale-90" title="Next Recitation">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <button id="skipFwdBtn" class="p-2 text-emerald-300/80 hover:text-gold-400 transition-colors rounded-lg hover:bg-emerald-900/40" title="Fast Forward 10 Seconds">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z"/></svg>
          </button>
        </div>

        <!-- Right: 3-State Loop Controller -->
        <div class="flex items-center gap-1.5">
          <button id="loopBtn" class="relative flex items-center gap-1 p-2 rounded-xl transition-all border border-emerald-700/40 text-emerald-300 hover:text-white hover:bg-emerald-900/50" title="Cycle Loop Mode: Repeat All, Repeat Single, or Off">
            <!-- Icon for Repeat All -->
            <svg id="loopIconAll" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            
            <!-- Badge Indicator: ALL, 1, OFF -->
            <span id="loopModeBadge" class="text-[10px] font-extrabold font-mono">ALL</span>
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- Audio Element -->
  <audio id="audioPlayer" preload="auto"></audio>

  <!-- Interactive Toast Notification -->
  <div id="toastEl" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-emerald-900/95 border border-gold-500/50 text-gold-300 font-semibold text-xs shadow-xl backdrop-blur-xl flex items-center gap-2 select-none pointer-events-none">
    <span id="toastIcon">🔁</span>
    <span id="toastText">Loop Mode: Repeat All</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
